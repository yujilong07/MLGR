<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f4ef">
  <title>Мої звіти — MLGR</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sb-logo">
      <a href="dashboard.html">
        <div class="logo-name">MLGR</div>
        <div class="logo-sub">Звіти · ХНУРЕ</div>
      </a>
    </div>

    <nav class="nav-section">
      <span class="nav-label">Розділи</span>
      <a href="#" id="nav-reports" class="nav-link active">Мої звіти</a>
      <a href="#" id="nav-discs" class="nav-link">Дисципліни</a>
      <a href="editor.html" class="nav-link">Новий звіт</a>
    </nav>

    <div class="sb-footer">
      <div class="user-row">
        <div class="user-ava" id="sb-avatar">?</div>
        <div class="user-email" id="sb-email"></div>
      </div>
      <button id="sb-logout" class="btn btn-ghost btn-sm btn-full">Вийти</button>
    </div>
  </aside>

  <main class="main">

    <div class="page-hdr">
      <div>
        <h1 id="page-title">Мої звіти</h1>
        <p class="page-subtitle" id="page-subtitle">Усі звіти, від нових до старих</p>
      </div>
      <div class="flex gap-8">
        <button id="btn-back-disc" class="btn btn-secondary hidden">До списку дисциплін</button>
        <button id="btn-new" class="btn btn-primary">Новий звіт</button>
      </div>
    </div>

    <div class="stats-bar">
      <span><span class="stat-val" id="stat-total">—</span>звітів</span>
      <span><span class="stat-val" id="stat-month">—</span>цього місяця</span>
      <span><span class="stat-val" id="stat-discs">—</span>дисциплін</span>
    </div>

    <div id="reports-section">
      <div class="toolbar">
        <input id="search-input" type="search" placeholder="Пошук за назвою або дисципліною">
      </div>
      <div id="reports-grid" class="reports-grid">
        <div class="empty-state"><p>Завантаження…</p></div>
      </div>
    </div>

    <div id="disc-section" class="hidden">
      <div id="disc-grid" class="disc-grid"></div>
    </div>

  </main>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
