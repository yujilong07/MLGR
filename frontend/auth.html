<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f4ef">
  <title>Вхід — MLGR</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="auth-body">

  <div class="auth-wrap">

    <div class="auth-logo-block">
      <a href="index.html">
        <div class="logo-name">MLGR</div>
        <div class="logo-sub">Звіти до лабораторних робіт · ХНУРЕ</div>
      </a>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Вхід</button>
        <button class="tab-btn"        data-tab="register">Реєстрація</button>
      </div>

      <form id="form-login" class="auth-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="ivan.petrenko@nure.ua" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="login-pass">Пароль</label>
          <input id="login-pass" type="password" autocomplete="current-password" required>
        </div>
        <div id="login-err" class="error-box hidden"></div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Увійти</button>
      </form>

      <form id="form-register" class="auth-form hidden">
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="ivan.petrenko@nure.ua" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="reg-pass">Пароль</label>
          <input id="reg-pass" type="password" placeholder="Щонайменше 8 символів" autocomplete="new-password" required minlength="8">
        </div>
        <div id="reg-err" class="error-box hidden"></div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Створити акаунт</button>
      </form>
    </div>

    <a href="index.html" class="auth-hint">На головну</a>

  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
